<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NoxPatch support inbox</title>
  <link rel="icon" href="../icon.png">
  <style>
    :root { --bg: #1d2540; --card: #fff8ea; --ink: #2b2b3a; --muted: #6b6474; --gold: #ffc94d; --line: #e6dac2; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: #fff; }
    header img { width: 40px; height: 40px; border-radius: 10px; }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    header .who { font-size: 13px; opacity: .8; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 8px 14px; background: var(--gold); color: #3b2a00; cursor: pointer; }
    button.ghost { background: transparent; color: inherit; border: 1.5px solid currentColor; }
    main { max-width: 1100px; margin: 0 auto; padding: 0 14px 40px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .bar button { background: #344069; color: #fff; }
    .bar button.on { background: var(--gold); color: #3b2a00; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 14px; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    .list, .detail, .card { background: var(--card); border-radius: 16px; }
    .list { max-height: 78vh; overflow: auto; }
    .item { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .item:hover, .item.sel { background: #fdebc2; }
    .item .t { font-weight: 700; display: flex; gap: 6px; align-items: center; }
    .item .m { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: #e8dcc2; white-space: nowrap; }
    .tag.issue { background: #ffd9d2; color: #8a2a17; } .tag.feature { background: #d9f2dc; color: #1d6b2c; }
    .tag.done { background: #d7e3ff; color: #234192; }
    .detail { padding: 18px 20px; min-height: 300px; }
    .detail h2 { margin: 0 0 6px; font-size: 20px; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 14px; margin: 12px 0; }
    .kv b { color: var(--muted); font-weight: 600; }
    .msg { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .shots { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .shots img { max-height: 260px; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .card { max-width: 560px; margin: 40px auto; padding: 24px; }
    .card code { background: #fff; padding: 2px 6px; border-radius: 6px; user-select: all; word-break: break-all; }
    .empty { color: var(--muted); padding: 20px; text-align: center; }
    a { color: #234192; }
  </style>
</head>
<body>
<header>
  <img src="../icon.png" alt="">
  <h1>NoxPatch · Support inbox</h1>
  <span class="who" id="who"></span>
  <button class="ghost" id="out" hidden>Sign out</button>
</header>
<main id="app"><p class="empty" style="color:#fff">Loading…</p></main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

// Same public web config as the app. Only accounts listed in Firestore "admins" can read tickets (firestore.rules).
const app = initializeApp({
  apiKey: 'AIzaSyAkGFSK5lawplfrJgER71x7pSPLk_nUjZw', authDomain: 'owl-grove-51e8f.firebaseapp.com', projectId: 'owl-grove-51e8f',
  appId: '1:589155193214:web:534a29e5a307c7da00a32f',
});
const auth = getAuth(app), db = getFirestore(app);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (ts) => ts && ts.toDate ? ts.toDate().toLocaleString() : '';
let tickets = [], filter = 'open', selected = null;

$('#out').onclick = () => signOut(auth);
onAuthStateChanged(auth, async (u) => {
  $('#out').hidden = !u; $('#who').textContent = u ? u.email : '';
  if (!u) {
    $('#app').innerHTML = `<div class="card"><h2>Sign in</h2><p>Sign in with the Google account you use for NoxPatch support.</p><button id="in">Sign in with Google</button><p id="e" style="color:#c0392b"></p></div>`;
    $('#in').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => { $('#e').textContent = e.code === 'auth/unauthorized-domain' ? 'This website isn’t allowed yet: in Firebase → Authentication → Settings → Authorized domains, add rskylarkcove.github.io' : e.message; });
    return;
  }
  const isAdmin = await getDoc(doc(db, 'admins', u.uid)).then((s) => s.exists()).catch(() => false);
  if (!isAdmin) {
    $('#app').innerHTML = `<div class="card"><h2>Not an admin yet</h2>
      <p>To let this account read tickets, add it as an admin once:</p>
      <ol><li>Open <a href="https://console.firebase.google.com/project/owl-grove-51e8f/firestore/databases/-default-/data" target="_blank">Firebase → Firestore Database</a>.</li>
      <li>Click <b>+ Start collection</b>, Collection ID: <code>admins</code>.</li>
      <li>Document ID: <code>${esc(u.uid)}</code></li>
      <li>Add one field: <code>email</code> (string) = <code>${esc(u.email)}</code>, then <b>Save</b>.</li>
      <li>Reload this page.</li></ol></div>`;
    return;
  }
  await load();
});

async function load() {
  $('#app').innerHTML = '<p class="empty" style="color:#fff">Loading tickets…</p>';
  const snap = await getDocs(query(collection(db, 'tickets'), orderBy('createdAt', 'desc'), limit(300)));
  tickets = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  render();
}
function render() {
  const shown = tickets.filter((t) => filter === 'all' || (filter === 'open' ? t.status !== 'done' : filter === t.kind));
  const counts = { open: tickets.filter((t) => t.status !== 'done').length, issue: tickets.filter((t) => t.kind === 'issue').length, feature: tickets.filter((t) => t.kind === 'feature').length, all: tickets.length };
  $('#app').innerHTML = `<div class="bar">${[['open', 'Open'], ['issue', '🐞 Issues'], ['feature', '💡 Features'], ['all', 'All']].map(([k, l]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${l} (${counts[k]})</button>`).join('')}<button id="rl">↻ Refresh</button></div>
    <div class="layout"><div class="list">${shown.map((t) => `<div class="item ${selected === t.id ? 'sel' : ''}" data-id="${t.id}">
      <div class="t"><span class="tag ${t.kind}">${t.kind === 'issue' ? esc(t.category) : 'Feature'}</span>${t.status === 'done' ? '<span class="tag done">Done</span>' : ''}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</span>${t.files ? '📎' : ''}</div>
      <div class="m">${esc(when(t.createdAt))} · ${esc(t.message)}</div></div>`).join('') || '<p class="empty">Nothing here 🎉</p>'}</div>
    <div class="detail" id="detail"><p class="empty">Pick a ticket on the left.</p></div></div>`;
  document.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { filter = b.dataset.f; render(); });
  $('#rl').onclick = load;
  document.querySelectorAll('.item').forEach((i) => i.onclick = () => { selected = i.dataset.id; render(); });
  if (selected && tickets.find((t) => t.id === selected)) show(tickets.find((t) => t.id === selected));
}
async function show(t) {
  const a = t.app || {}, ref = '#' + t.id.slice(0, 6).toUpperCase();
  const subject = encodeURIComponent(`Re: NoxPatch support ${ref}`);
  const body = encodeURIComponent(`Hi ${t.name},\n\nThanks for contacting NoxPatch support about:\n> ${t.message.slice(0, 300)}\n\n\n\n— RSkylark Cove`);
  $('#detail').innerHTML = `<h2>${t.kind === 'issue' ? '🐞' : '💡'} ${esc(t.kind === 'issue' ? t.category : 'Feature request')} <span style="color:var(--muted);font-size:15px">${ref}</span></h2>
    <div class="kv"><b>From</b><span>${esc(t.name)} &lt;<a href="mailto:${esc(t.email)}">${esc(t.email)}</a>&gt;</span>
      <b>Sent</b><span>${esc(when(t.createdAt))}</span>
      <b>Status</b><span>${t.status === 'done' ? 'Done ✓' : 'Open'}</span>
      <b>Signed in</b><span>${t.uid ? 'Yes · UID ' + esc(t.uid) : 'No (guest)'}</span>
      <b>App</b><span>${esc(a.version)} (build ${esc(a.build)}) · ${esc(a.platform)} · language ${esc(a.lang)} · level ${esc(a.level)}${a.adsRemoved ? ' · Remove Ads ✓' : ''}</span>
      <b>Device</b><span style="font-size:12px;color:var(--muted)">${esc(a.device)}</span>
      ${t.videoLink ? `<b>Video</b><span><a href="${esc(t.videoLink)}" target="_blank" rel="noopener">${esc(t.videoLink)}</a></span>` : ''}</div>
    <div class="msg">${esc(t.message)}</div>
    <div class="shots" id="shots">${t.files ? 'Loading screenshots…' : ''}</div>
    <div class="actions"><a href="mailto:${esc(t.email)}?subject=${subject}&body=${body}"><button>✉️ Reply by email</button></a>
      <button class="ghost" id="st">${t.status === 'done' ? 'Reopen' : 'Mark as done'}</button></div>`;
  $('#st').onclick = async () => {
    const status = t.status === 'done' ? 'open' : 'done';
    await updateDoc(doc(db, 'tickets', t.id), { status, updatedAt: serverTimestamp() });
    t.status = status; render();
  };
  if (t.files) {
    const imgs = [];
    for (let i = 0; i < t.files; i++) { const s = await getDoc(doc(db, 'tickets', t.id, 'files', String(i))); if (s.exists()) imgs.push(s.data()); }
    const box = $('#shots'); if (!box || selected !== t.id) return;
    box.innerHTML = imgs.map((f) => `<a href="${f.data}" target="_blank" download="${esc(t.id)}-${esc(f.name)}"><img src="${f.data}" alt="screenshot"></a>`).join('') || 'Screenshots didn’t upload.';
  }
}
</script>
</body>
</html>
